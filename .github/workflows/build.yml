name: MYCA build and ParsPack package

on:
  push:
    branches: [main, parspack-preview]
  pull_request:
    branches: [main, parspack-preview]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: myca_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Validate ParsPack API syntax
        run: php -l public/api/index.php
      - name: Run PHP/MySQL integration test
        run: bash tests/parspack-api-smoke.sh
      - name: Build static website
        run: npm run build
      - name: Ensure Apache and PHP runtime files are in export
        run: |
          mkdir -p out/api
          cp public/.htaccess out/.htaccess
          cp public/robots.txt out/robots.txt
          cp public/api/index.php out/api/index.php
          cp public/api/.htaccess out/api/.htaccess
      - name: Package ParsPack preview
        if: github.ref == 'refs/heads/parspack-preview'
        run: |
          rm -rf package myca-parspack-preview.zip
          mkdir -p package/public package/private package/database
          cp -a out/. package/public/
          cp deploy/parspack/private/config.example.php package/private/config.example.php
          cp deploy/parspack/database/schema.sql package/database/schema.sql
          cp docs/parspack-preview.md package/README.md
          (cd package && zip -qr ../myca-parspack-preview.zip .)
      - name: Upload ParsPack package
        if: github.ref == 'refs/heads/parspack-preview'
        uses: actions/upload-artifact@v4
        with:
          name: myca-parspack-preview
          path: myca-parspack-preview.zip
          if-no-files-found: error
          retention-days: 14
